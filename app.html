<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marketing Hub · Lifestyle Christianity</title>
<link rel="icon" href="assets/img/logo-lc-square.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10">
</head>
<body data-brand="all">
<header class="app-bar">
  <button class="app-menu" id="app-menu" aria-label="Show navigation" aria-expanded="false">☰</button>
  <a class="mh-brand" href="#/brief"><img src="assets/img/logo-lc-menu.png" alt="Lifestyle Christianity"><span>Marketing Hub</span></a>
  <div class="brand-seg" id="brand-seg" role="group" aria-label="Filter by brand"></div>
</header>
<div class="app-grid">
  <nav class="app-nav" id="app-nav" aria-label="Hub navigation">
    <input class="app-filter" id="app-filter" type="search" placeholder="Filter the menu" aria-label="Filter the menu">
    <div id="app-tree" class="tree"></div>
  </nav>
  <main class="app-main" id="app-main" tabindex="-1"></main>
</div>
<aside class="app-drawer" id="app-drawer" aria-hidden="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div class="drawer-nav"><button type="button" id="drawer-back" aria-label="Previous drawer" disabled>←</button><button type="button" id="drawer-fwd" aria-label="Next drawer" disabled>→</button></div>
    <div class="drawer-ttl"><h2 id="drawer-title"></h2><div class="drawer-sub" id="drawer-sub"></div></div>
    <button class="drawer-close" id="drawer-close" aria-label="Close the details">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <h1>Marketing Hub</h1>
    <p>Enter the hub password.</p>
    <label for="gate-pw">Password</label>
    <input id="gate-pw" type="password" required autocomplete="current-password">
    <button class="btn" type="submit">Open the hub</button>
    <p class="note" id="gate-msg" role="status" aria-live="polite"></p>
  </form>
</div>
<div id="chart-tip" class="chart-tip" hidden></div>
<script src="hub-core.js?v=7"></script>
<script src="gate.js?v=3"></script>
<script src="review.config.js?v=1"></script>
<script src="review-bootstrap.js?v=1"></script>
</body>
</html>
